name: release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        default: 'v1.0.0'
      title:
        description: 'Release title'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: liberica
          java-version: 21
          architecture: x64

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build project
        shell: bash
        run: ./gradlew build

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
        run: gh release create "$TAG" build/libs/*.jar --title "${TITLE:-$TAG}" --generate-notes
