name: build
on:
  push:
    branches:
      - main

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: liberica
          java-version: 22
          architecture: x64

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build project
        shell: bash
        run: ./gradlew build
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FFF
          path: output/FFF
          retention-days: 14
          