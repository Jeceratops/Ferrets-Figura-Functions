plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven { url = 'https://jitpack.io' }
    mavenCentral()
}

configurations {
    sableCompanion
}

def sableCompanionJar = layout.buildDirectory.file("sable-companion/sable-companion-common-1.6.0.jar")

def unpackSableCompanion = tasks.register('unpackSableCompanion') {
    inputs.files(configurations.sableCompanion)
    outputs.file(sableCompanionJar)
    doLast {
        def nested = project.zipTree(configurations.sableCompanion.singleFile)
                .matching { include 'META-INF/jarjar/sable-companion-common-*.jar' }
                .singleFile
        sableCompanionJar.get().asFile.withOutputStream { out ->
            nested.withInputStream { input -> out << input }
        }
    }
}

tasks.named('compileJava').configure {
    dependsOn unpackSableCompanion
}

dependencies {
    implementation "maven.modrinth:figura:${figura_version}-neoforge"
    implementation "com.github.FiguraMC.luaj:luaj-core:${luaj_version}-figura"
    implementation "com.github.FiguraMC.luaj:luaj-jse:${luaj_version}-figura"

    compileOnly files(sableCompanionJar)
    compileOnly "maven.modrinth:moonlight:1.21.1-3.7.1-neoforge"
    compileOnly "maven.modrinth:sable:2.0.6+mc1.21.1-neoforge"
    compileOnly "maven.modrinth:create:6.0.10+mc1.21.1-neoforge"
    compileOnly "maven.modrinth:what-are-they-up-to:1.21.0-1.2.7-neoforge"
    compileOnly "maven.modrinth:ziplines-rezipped:1.5.3+1.21.1-neoforge"

    sableCompanion "maven.modrinth:sable:2.0.6+mc1.21.1-neoforge"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
